# Replace: replace all sensor.* and switch.* IDs with your own entities.
# Replace: create an input_datetime helper named input_datetime.soilpulse_last_watering
#       with date and time enabled. It stores the last watering run.
# Safety rules: run only when soil is dry, battery is healthy, the valve is off,
# and at least 12 hours have passed since the previous run.
alias: SoilPulse auto irrigation
description: Water for 30 seconds when soil moisture stays low, with cooldown
trigger:
  - platform: numeric_state
    entity_id: sensor.soilpulse_moisture
    below: 15
    for:
      minutes: 20
condition:
  - condition: numeric_state
    entity_id: sensor.soilpulse_moisture
    below: 15
  - condition: numeric_state
    entity_id: sensor.soilpulse_battery
    above: 25
  - condition: state
    entity_id: switch.irrigation_valve
    state: "off"
  - condition: template
    value_template: >-
      {{ (as_timestamp(now()) - (state_attr('input_datetime.soilpulse_last_watering', 'timestamp') | default(0))) > 43200 }}
action:
  - service: switch.turn_on
    target:
      entity_id: switch.irrigation_valve
  - delay: "00:00:30"
  - service: switch.turn_off
    target:
      entity_id: switch.irrigation_valve
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.soilpulse_last_watering
    data:
      timestamp: "{{ as_timestamp(now()) }}"
mode: single
max_exceeded: silent
